name: suite

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile every tool script (syntax gate)
        run: |
          python -m compileall -q skills tools
        shell: bash

      - name: Suite-internal consistency tests (stdlib only)
        run: |
          python -m unittest discover -s tests -v
        shell: bash

      - name: Dashboard JavaScript checks
        run: |
          node --check skills/short-drama/assets/dashboard/app.js
          node tests/test_dashboard_app.js
        shell: bash

      - name: Suite verification against the pinned manifest
        run: |
          python skills/short-drama/scripts/suite_verify.py --no-cache
        shell: bash

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.10

      - name: Ruff
        run: ruff check skills tools tests
